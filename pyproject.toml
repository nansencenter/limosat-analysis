[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limosat-analysis"
version = "0.1.0"
description = "Readers and analysis examples for LiMOSAT trajectories"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2", "pyarrow>=12"]

[project.optional-dependencies]
notebooks = ["matplotlib", "cartopy", "pyproj", "ipykernel"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
